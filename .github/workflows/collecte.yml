name: Collecte des offres

on:
  schedule:
    - cron: "0 5,8,11,14,17,20 * * *" # toutes les 3 h de 6 h à 21 h (heure de Paris, en hiver)
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collecte.py
      - name: Publier les nouvelles offres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offres.js geocache.json
          git diff --cached --quiet || git commit -m "Mise à jour des offres"
          git pull --rebase
          git push
