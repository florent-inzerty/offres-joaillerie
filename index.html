<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offres joaillerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<meta name="theme-color" content="#f6f4f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- ?t= : toujours la dernière version des offres, jamais celle en cache -->
<script>document.write(`<script src="offres.js?t=${Date.now()}"><\/script>`)</script>
<style>
  :root {
    --bg: #f6f4f0; --panel: rgba(255,255,255,.92); --carte: #fff; --texte: #1d1a17; --doux: #7b736b;
    --bord: #ebe6df; --or: #b4872f; --or-doux: #f5ecda; --ombre: 0 10px 40px rgba(40,30,15,.12);
    --cdi: #2f7d5b; --cdd: #3a66b8; --alt: #8a4fbf; --autre: #8b8178;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141210; --panel: rgba(28,25,22,.92); --carte: #211e1a; --texte: #f1ece5; --doux: #a39a90;
            --bord: #332e28; --or: #d9ad5b; --or-doux: #3a3020; --ombre: 0 10px 40px rgba(0,0,0,.5);
            --cdi: #5cc496; --cdd: #7ea4f0; --alt: #c18ef0; --autre: #a39a90; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.5 Inter, system-ui, sans-serif; background: var(--bg); color: var(--texte); }
  #carte { position: fixed; inset: 0; background: var(--bg); }

  /* panneau flottant */
  .panneau { position: fixed; top: 16px; left: 16px; bottom: 16px; width: 420px; z-index: 500;
             background: var(--panel); backdrop-filter: blur(14px); border: 1px solid var(--bord);
             border-radius: 20px; box-shadow: var(--ombre); display: flex; flex-direction: column; overflow: hidden; }
  .entete { padding: 22px 22px 14px; border-bottom: 1px solid var(--bord); }
  h1 { font: 600 24px/1.15 Fraunces, Georgia, serif; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--or); }
  .sous { color: var(--doux); font-size: 13px; margin-top: 4px; }
  .stats { display: flex; gap: 8px; margin-top: 14px; }
  .stat { flex: 1; background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 8px 12px; }
  .stat b { display: block; font-size: 20px; line-height: 1.2; }
  .stat small { color: var(--doux); font-size: 12px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .chip { border: 1px solid var(--bord); background: var(--carte); color: var(--doux); font: 500 13px Inter, sans-serif;
          padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); opacity: .35; }
  .chip[aria-pressed="true"] { color: var(--texte); border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--carte)); }
  .chip[aria-pressed="true"]::before { opacity: 1; }
  .chip:focus-visible, .carte-offre:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }

  .ville-active { display: none; align-items: center; justify-content: space-between; margin: 12px 22px 0;
                  padding: 8px 12px; background: var(--or-doux); border-radius: 12px; font-weight: 600; font-size: 14px; }
  .ville-active.on { display: flex; }
  .ville-active button { border: 0; background: none; color: var(--or); font: 600 13px Inter, sans-serif; cursor: pointer; }

  .liste { flex: 1; overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .carte-offre { display: block; text-decoration: none; color: inherit; background: var(--carte); border: 1px solid var(--bord);
                 border-radius: 14px; padding: 14px 16px; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .carte-offre:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(40,30,15,.10); border-color: var(--or); }
  .ligne { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .titre { font-weight: 600; font-size: 15px; margin: 6px 0 2px; }
  .ent { color: var(--doux); font-size: 13px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
         color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
  .nouveau { --c: var(--or); }
  .lieu { font-size: 12px; color: var(--doux); }
  .desc { font-size: 13px; color: var(--doux); margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2;
          -webkit-box-orient: vertical; overflow: hidden; }
  .pied { font-size: 12px; color: var(--doux); margin-top: 8px; display: flex; justify-content: space-between; }
  .pied span:last-child { color: var(--or); font-weight: 600; }
  .vide { text-align: center; color: var(--doux); padding: 40px 20px; }
  .vide div { font-size: 40px; margin-bottom: 8px; }

  /* marqueurs */
  .pin { background: var(--or); color: #fff; font: 700 13px Inter, sans-serif; min-width: 32px; height: 32px; padding: 0 8px;
         border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 3px solid #fff;
         box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: transform .15s; cursor: pointer; }
  .pin.actif, .pin:hover { transform: scale(1.18); background: var(--texte); }
  .leaflet-tooltip { font: 500 13px Inter, sans-serif; border-radius: 8px; border: 0; box-shadow: var(--ombre); }
  .leaflet-control-zoom { border: 0 !important; box-shadow: var(--ombre) !important; border-radius: 12px !important; overflow: hidden; }
  .leaflet-control-zoom a { background: var(--panel) !important; color: var(--texte) !important; border-color: var(--bord) !important; }
  .leaflet-control-attribution { background: var(--panel) !important; color: var(--doux) !important; }
  .leaflet-control-attribution a { color: var(--doux) !important; }

  @media (max-width: 760px) {
    #carte { position: relative; height: 42vh; }
    .panneau { position: relative; inset: auto; width: auto; margin: -24px 0 0; border-radius: 20px 20px 0 0;
               min-height: 58vh; backdrop-filter: none; background: var(--bg); }
    .entete { padding: 18px 16px 12px; }
    .liste { padding: 12px 16px 24px; }
    .ville-active { margin: 12px 16px 0; }
  }
</style>
</head>
<body>
<div id="carte"></div>
<main class="panneau">
  <div class="entete">
    <h1>Bijouterie <span>·</span> Joaillerie</h1>
    <div class="sous">Postes en atelier · 30 km autour d'Armentières</div>
    <div class="stats">
      <div class="stat"><b id="nbOffres">0</b><small>offres</small></div>
      <div class="stat"><b id="nbNouvelles">0</b><small>nouvelles (3 j)</small></div>
      <div class="stat"><b id="maj">–</b><small>dernière vérif.</small></div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" aria-pressed="true" data-c="CDI" style="--c:var(--cdi)">CDI</button>
      <button class="chip" aria-pressed="true" data-c="CDD" style="--c:var(--cdd)">CDD</button>
      <button class="chip" aria-pressed="true" data-c="Alternance" style="--c:var(--alt)">Alternance</button>
      <button class="chip" aria-pressed="true" data-c="Autre" style="--c:var(--autre)">Autre</button>
    </div>
  </div>
  <div class="ville-active" id="villeActive"><span id="villeNom"></span><button id="toutes">Toutes les villes ✕</button></div>
  <div class="liste" id="liste"></div>
</main>
<script>
const data = window.DATA || { maj: null, offres: [] };
const CENTRE = [50.6886, 2.8807], RAYON = 30000; // Armentières, 30 km (comme collecte.py)
const COULEUR = { CDI: "--cdi", CDD: "--cdd", Alternance: "--alt", Autre: "--autre" };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const groupe = c => c in COULEUR ? c : "Autre";
const estNouvelle = o => o.vu_le && (Date.now() - new Date(o.vu_le)) < 3 * 864e5;
function ilYa(iso) {
  if (!iso) return "jamais";
  const min = Math.round((Date.now() - new Date(iso)) / 6e4);
  return min < 60 ? `${min} min` : min < 1440 ? `${Math.round(min / 60)} h` : `${Math.round(min / 1440)} j`;
}

// Carte verrouillée sur la zone : on ne peut ni dézoomer ni sortir.
const sombre = matchMedia("(prefers-color-scheme: dark)").matches;
const carte = L.map("carte", { zoomControl: false, zoomSnap: 0.25 });
L.control.zoom({ position: "topright" }).addTo(carte);
// Fond gris Esri (sans clé API) + calque des noms de villes
const esri = n => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${sombre ? "Dark" : "Light"}_Gray_${n}/MapServer/tile/{z}/{y}/{x}`;
L.tileLayer(esri("Base"), { attribution: "© Esri, OpenStreetMap", maxZoom: 16 }).addTo(carte);
L.tileLayer(esri("Reference"), { maxZoom: 16 }).addTo(carte);
const bornes = L.latLng(CENTRE).toBounds(RAYON * 2);
carte.fitBounds(bornes, { paddingTopLeft: innerWidth > 760 ? [460, 20] : [20, 20], paddingBottomRight: [20, 20] }); // place pour le panneau
L.circle(CENTRE, { radius: RAYON, color: getComputedStyle(document.documentElement).getPropertyValue("--or"),
                   weight: 1.5, dashArray: "6 6", fillOpacity: .04, interactive: false }).addTo(carte);
carte.setMinZoom(carte.getZoom());
carte.setMaxBounds(carte.getBounds().pad(0.15)); // la vue affichée (panneau compris), pas le cercle seul
carte.options.maxBoundsViscosity = 1;

const calque = L.layerGroup().addTo(carte);
let villeChoisie = null;
const pins = {};

function afficher() {
  const actifs = [...document.querySelectorAll(".chip[aria-pressed=true]")].map(b => b.dataset.c);
  const offres = data.offres.filter(o => actifs.includes(groupe(o.contrat)));

  document.getElementById("nbOffres").textContent = data.offres.length;
  document.getElementById("nbNouvelles").textContent = data.offres.filter(estNouvelle).length;
  document.getElementById("maj").textContent = ilYa(data.maj);

  calque.clearLayers();
  const parVille = {};
  offres.filter(o => o.coords).forEach(o => (parVille[o.ville] ??= []).push(o));
  for (const [ville, os] of Object.entries(parVille)) {
    const icone = L.divIcon({ className: "", iconSize: null,
      html: `<div class="pin ${ville === villeChoisie ? "actif" : ""}" data-ville="${esc(ville)}">${os.length}</div>` });
    pins[ville] = L.marker(os[0].coords, { icon: icone })
      .bindTooltip(`<b>${esc(ville)}</b> · ${os.length} offre${os.length > 1 ? "s" : ""}`, { direction: "top", offset: [0, -14] })
      .on("click", () => { villeChoisie = villeChoisie === ville ? null : ville; afficher(); })
      .addTo(calque);
  }

  const liste = villeChoisie ? offres.filter(o => o.ville === villeChoisie) : offres;
  document.getElementById("villeActive").classList.toggle("on", !!villeChoisie);
  document.getElementById("villeNom").textContent = villeChoisie ? `📍 ${villeChoisie} · ${liste.length} offre${liste.length > 1 ? "s" : ""}` : "";
  document.getElementById("liste").innerHTML = liste.length ? liste.map(o => `
    <a class="carte-offre" href="${esc(o.url)}" target="_blank" rel="noopener" data-ville="${esc(o.ville)}">
      <div class="ligne">
        <span class="tag" style="--c:var(${COULEUR[groupe(o.contrat)]})">${esc(o.contrat)}</span>
        ${estNouvelle(o) ? '<span class="tag nouveau">Nouveau</span>' : ""}
        <span class="lieu">📍 ${esc(o.ville)}</span>
      </div>
      <div class="titre">${esc(o.titre)}</div>
      <div class="ent">${esc(o.entreprise)}</div>
      ${o.description ? `<div class="desc">${esc(o.description)}</div>` : ""}
      <div class="pied"><span>${esc(o.source)}${o.date ? " · " + esc(o.date) : ""}</span><span>Voir l'offre →</span></div>
    </a>`).join("")
    : `<div class="vide"><div>💎</div>${data.offres.length
        ? "Aucune offre avec ces filtres."
        : "Aucune offre d'atelier dans la zone pour le moment.<br>La liste se met à jour toute seule plusieurs fois par jour."}</div>`;
}

// survol d'une carte = le rond de sa ville s'allume
document.getElementById("liste").addEventListener("mouseover", e => {
  const v = e.target.closest(".carte-offre")?.dataset.ville;
  document.querySelectorAll(".pin").forEach(p => p.classList.toggle("actif", p.dataset.ville === v || p.dataset.ville === villeChoisie));
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (b) { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); afficher(); }
});
document.getElementById("toutes").onclick = () => { villeChoisie = null; afficher(); };
afficher();
</script>
</body>
</html>
