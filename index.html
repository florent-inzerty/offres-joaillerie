<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offres joaillerie</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Joaillerie">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d0d0d'/><path d='M16 7l7 7-7 11-7-11z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="zone.js"></script>
<script>document.write(`<script src="ateliers.js?t=${Date.now()}"><\/script>`)</script>
<!-- ?t= : toujours la dernière version des offres, jamais celle en cache -->
<script>document.write(`<script src="offres.js?t=${Date.now()}"><\/script>`)</script>
<style>
  :root {
    --fond: #ffffff; --surface: #f9f9f9; --carte: #ffffff; --texte: #0d0d0d; --doux: #6b6b6b; --pale: #9b9b9b;
    --bord: #e5e5e5; --survol: #f3f3f3; --inverse: #0d0d0d; --sur-inverse: #ffffff;
    --ombre: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #212121; --surface: #171717; --carte: #2a2a2a; --texte: #ececec; --doux: #a3a3a3; --pale: #7a7a7a;
            --bord: #383838; --survol: #333333; --inverse: #ececec; --sur-inverse: #0d0d0d;
            --ombre: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.5 Inter, -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--fond); color: var(--texte);
         -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }

  /* en-tête */
  header { position: sticky; top: 0; z-index: 1000; background: color-mix(in srgb, var(--fond) 88%, transparent);
           backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
           padding: calc(14px + env(safe-area-inset-top)) 16px 0; border-bottom: 1px solid var(--bord); }
  .marque { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--inverse); display: grid; place-items: center; flex: none; }
  .logo svg { width: 16px; height: 16px; stroke: var(--sur-inverse); }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .sous { font-size: 12.5px; color: var(--doux); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 12px 0; margin: 0 -16px; padding-inline: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--bord); background: transparent; padding: 6px 12px; border-radius: 999px;
          font-size: 13px; font-weight: 500; color: var(--doux); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .chip span { color: var(--pale); margin-left: 4px; font-weight: 400; }
  .chip[aria-pressed="true"] { background: var(--survol); color: var(--texte); border-color: var(--survol); }
  .chip[aria-pressed="false"] { color: var(--pale); }
  .chip.ville { background: var(--inverse); color: var(--sur-inverse); border-color: var(--inverse); }
  :focus-visible { outline: 2px solid var(--texte); outline-offset: 2px; }

  /* contenu */
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .vue-carte { position: relative; }
  .vue-liste { display: none; overflow-y: auto; padding: 12px 16px calc(96px + env(safe-area-inset-bottom)); }
  body.liste .vue-carte { display: none; }
  body.liste .vue-liste { display: block; }
  #carte { position: absolute; inset: 0; background: var(--surface); }
  .entete-liste { font-size: 13px; color: var(--doux); margin: 4px 2px 10px; }

  .offre { display: block; text-decoration: none; color: inherit; background: var(--carte); border: 1px solid var(--bord);
           border-radius: 16px; padding: 16px; margin-bottom: 10px; transition: background .15s, border-color .15s; }
  .offre:hover { background: var(--survol); }
  .offre:active { transform: scale(.99); }
  .haut { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .titre { font-weight: 600; font-size: 15.5px; line-height: 1.35; letter-spacing: -.01em; }
  .contrat { flex: none; font-size: 12px; font-weight: 500; padding: 2px 9px; border: 1px solid var(--bord); border-radius: 999px; color: var(--doux); }
  .ent { color: var(--doux); font-size: 14px; margin-top: 2px; }
  .desc { color: var(--doux); font-size: 13.5px; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2;
          -webkit-box-orient: vertical; overflow: hidden; }
  .bas { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--pale); margin-top: 12px; flex-wrap: wrap; }
  .bas .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--pale); }
  .nouveau { color: var(--texte); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .nouveau::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--texte); }

  .vide { text-align: center; padding: 56px 24px; color: var(--doux); }
  .vide .rond { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--bord); display: grid; place-items: center; margin: 0 auto 16px; }
  .vide .rond svg { width: 24px; height: 24px; stroke: var(--texte); }
  .vide b { display: block; color: var(--texte); font-weight: 600; margin-bottom: 4px; }
  .vide p { margin: 0; font-size: 14px; }

  /* barre Carte / Liste (téléphone) */
  .onglets { position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom));
             display: flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--carte); border: 1px solid var(--bord);
             box-shadow: 0 8px 30px rgba(0,0,0,.12); }
  .onglets button { border: 0; background: transparent; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 500;
                    color: var(--doux); cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .onglets button svg { width: 16px; height: 16px; stroke: currentColor; }
  .onglets button[aria-selected="true"] { background: var(--inverse); color: var(--sur-inverse); }

  /* ateliers */
  .recherche { width: 100%; font: inherit; font-size: 14px; color: var(--texte); background: var(--surface); border: 1px solid var(--bord);
               border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; outline: none; }
  .recherche:focus { border-color: var(--texte); }
  .atelier.contacte { opacity: .55; }
  .tags { display: flex; gap: 6px; flex: none; }
  .liens { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .liens a { font-size: 13px; color: var(--texte); text-decoration: none; border: 1px solid var(--bord); border-radius: 999px; padding: 4px 11px;
             max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liens a:hover { background: var(--survol); }
  .inconnu { font-size: 12.5px; color: var(--pale); margin-top: 10px; }
  .contact { margin-top: 12px; width: 100%; border: 1px dashed var(--bord); background: transparent; border-radius: 12px; padding: 9px;
             font-size: 13.5px; font-weight: 500; color: var(--doux); cursor: pointer; }
  .contact.fait { border-style: solid; background: var(--inverse); color: var(--sur-inverse); border-color: var(--inverse); }
  /* fiche d'un atelier touché sur la carte : en bas de l'écran, au-dessus de la barre */
  .fiche { position: fixed; z-index: 1001; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom));
           max-width: 420px; margin: 0 auto; box-shadow: 0 12px 40px rgba(0,0,0,.18); border-radius: 16px; }
  .fiche[hidden] { display: none; }
  .fiche .offre { margin: 0; padding-right: 44px; }
  .fermer { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%;
            background: var(--survol); color: var(--doux); cursor: pointer; font-size: 15px; line-height: 1; }

  /* carte */
  .pin { background: var(--inverse); color: var(--sur-inverse); font: 600 12.5px Inter, sans-serif; min-width: 28px; height: 28px;
         padding: 0 8px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
         border: 2px solid var(--fond); box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: transform .15s; }
  .pin.actif, .pin:hover { transform: scale(1.2); }
  .moi { width: 16px; height: 16px; border-radius: 50%; background: var(--fond); border: 4px solid var(--inverse);
         box-shadow: 0 0 0 6px color-mix(in srgb, var(--inverse) 15%, transparent); }
  .leaflet-tooltip.moi-nom { background: none; border: 0; box-shadow: none; padding: 0; font-weight: 600; color: var(--texte);
                             text-shadow: 0 0 3px var(--fond), 0 0 3px var(--fond), 0 0 3px var(--fond); }
  .leaflet-tooltip.moi-nom::before { display: none; }
  .leaflet-container { font-family: inherit; }
  .leaflet-tooltip { font: 500 13px Inter, sans-serif; background: var(--carte); color: var(--texte); border: 1px solid var(--bord);
                     border-radius: 10px; box-shadow: var(--ombre); padding: 6px 10px; }
  .leaflet-tooltip-top::before { border-top-color: var(--carte); }
  .leaflet-control-zoom { border: 1px solid var(--bord) !important; border-radius: 12px !important; overflow: hidden; box-shadow: var(--ombre) !important; }
  .leaflet-control-zoom a { background: var(--carte) !important; color: var(--texte) !important; border-color: var(--bord) !important; }
  .leaflet-control-attribution { background: color-mix(in srgb, var(--fond) 80%, transparent) !important; color: var(--pale) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--pale) !important; }
  @media (prefers-color-scheme: dark) { .leaflet-tile-pane { filter: brightness(.9) contrast(1.05); } }

  /* ordinateur : liste et carte côte à côte */
  @media (min-width: 900px) {
    header { padding-inline: 24px; }
    .chips { margin: 0 -24px; padding-inline: 24px; }
    main { grid-template-columns: 460px 1fr; }
    .vue-carte, body.liste .vue-carte { display: block; }
    .vue-liste { display: block; padding: 16px 24px 24px; border-right: 1px solid var(--bord); }
    .onglets [data-vue="carte"] { display: none; } /* la carte est toujours visible */
    .fiche { left: auto; right: 16px; width: 380px; margin: 0; }
    .vue-liste { overflow-y: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="marque">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7 7-7 11-7-11z"/></svg></div>
    <div>
      <h1>Bijouterie · Joaillerie</h1>
      <div class="sous" id="sous">Atelier · Armentières 30 km</div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section class="vue-liste">
    <div class="entete-liste" id="enteteListe"></div>
    <div id="liste"></div>
  </section>
  <section class="vue-carte"><div id="carte"></div></section>
</main>


<div class="fiche" id="fiche" hidden></div>

<nav class="onglets" role="tablist">
  <button role="tab" aria-selected="true" data-vue="carte">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Carte</button>
  <button role="tab" aria-selected="false" data-vue="offres">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Offres</button>
  <button role="tab" aria-selected="false" data-vue="ateliers">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7 7-7 11-7-11z"/></svg>Ateliers</button>
</nav>

<script>
const data = window.DATA || { maj: null, offres: [] };
const annuaire = window.ATELIERS || { maj: null, liste: [] };
const CENTRE = [50.6886, 2.8807]; // Armentières (comme collecte.py)
const CONTRATS = ["CDI", "CDD", "Alternance", "Autre"];
const actifs = new Set(CONTRATS);
// filtres des ateliers : types affichés (actifs par défaut) et restrictions (inactives par défaut)
const filtresA = { Atelier: true, Bijouterie: true, "Chaînes": true, "Avec salariés": false, "À contacter": false };
let mode = "offres", villeChoisie = null, recherche = "", ficheId = null;

// Ateliers déjà contactés : gardés dans ce navigateur uniquement (téléphone ≠ ordinateur)
let contactes = {};
try { contactes = JSON.parse(localStorage.getItem("contactes")) || {}; } catch {}
function basculerContact(id) {
  contactes[id] ? delete contactes[id] : contactes[id] = new Date().toISOString().slice(0, 10);
  try { localStorage.setItem("contactes", JSON.stringify(contactes)); } catch {}
  afficher();
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const groupe = c => CONTRATS.includes(c) ? c : "Autre";
const estNouvelle = o => o.vu_le && (Date.now() - new Date(o.vu_le)) < 3 * 864e5;
const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
const salarie = l => l.salaries && l.salaries !== "0 salarié";
const dateFr = iso => new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
function ilYa(iso) {
  if (!iso) return "jamais";
  const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 6e4));
  return "il y a " + (min < 60 ? `${min} min` : min < 1440 ? `${Math.round(min / 60)} h` : pluriel(Math.round(min / 1440), "jour"));
}

// Carte : verrouillée sur la zone, fond gris Esri (sans clé API) + noms de villes
const sombre = matchMedia("(prefers-color-scheme: dark)").matches;
const carte = L.map("carte", { zoomControl: false, zoomSnap: 0.25 });
L.control.zoom({ position: "topright" }).addTo(carte);
const esri = n => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${sombre ? "Dark" : "Light"}_Gray_${n}/MapServer/tile/{z}/{y}/{x}`;
L.tileLayer(esri("Base"), { attribution: "© Esri, OpenStreetMap", maxZoom: 16 }).addTo(carte);
L.tileLayer(esri("Reference"), { maxZoom: 16 }).addTo(carte);

// Zone = cercle de 30 km découpé aux limites du Nord (zone.js, généré par zone.py) ; le reste est grisé
const encre = sombre ? "#ececec" : "#0d0d0d", papier = sombre ? "#2a2a2a" : "#ffffff";
const monde = [[85, -180], [85, 180], [-85, 180], [-85, -180]];
L.polygon([monde, ...window.ZONE], { stroke: false, fillColor: sombre ? "#000" : "#fff", fillOpacity: sombre ? .55 : .7,
                                      interactive: false }).addTo(carte);
const zone = L.polygon(window.ZONE, { color: encre, weight: 1.5, opacity: .6, dashArray: "4 6", fill: false, interactive: false }).addTo(carte);
L.marker(CENTRE, { icon: L.divIcon({ className: "", html: '<div class="moi"></div>', iconSize: [16, 16] }), interactive: false,
                   zIndexOffset: -100 })
  .bindTooltip("Armentières", { permanent: true, direction: "right", offset: [10, 0], className: "moi-nom" }).addTo(carte);
const calqueAteliers = L.layerGroup().addTo(carte); // sous les ronds d'offres
const calque = L.layerGroup().addTo(carte);

function cadrer() { // à refaire quand la taille de la carte change
  carte.invalidateSize();
  carte.setMinZoom(0).setMaxBounds(null);
  carte.fitBounds(zone.getBounds(), { padding: [16, 16], animate: false });
  carte.setMinZoom(carte.getZoom()).setMaxBounds(carte.getBounds().pad(0.15));
}
cadrer();

// Barre du bas : Carte (téléphone), Offres, Ateliers
function vue(nom) {
  if (nom !== "carte") { mode = nom; villeChoisie = null; }
  document.body.classList.toggle("liste", nom !== "carte");
  if (nom === "carte") cadrer();
  scrollTo(0, 0);
  document.querySelector(".vue-liste").scrollTop = 0;
  afficher();
}

// Deux villes proches (Roubaix/Tourcoing) : on écarte leurs ronds à l'écran pour qu'ils ne se cachent pas.
function ecarter() {
  const ms = calque.getLayers(), MIN = 34; // px entre deux centres
  const pts = ms.map(m => carte.latLngToLayerPoint(m.vraie));
  for (let tour = 0; tour < 20; tour++) {
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = pts[j].subtract(pts[i]), dist = d.distanceTo([0, 0]) || 0.01;
      if (dist >= MIN) continue;
      const pousse = (dist ? d : L.point(1, 0)).multiplyBy((MIN - dist) / 2 / dist);
      pts[i] = pts[i].subtract(pousse); pts[j] = pts[j].add(pousse);
    }
  }
  ms.forEach((m, i) => m.setLatLng(carte.layerPointToLatLng(pts[i])));
}
carte.on("zoomend", ecarter);

function ficheAtelier(l) {
  const site = l.site && l.site.replace(/^https?:\/\/(www\.)?/, "").replace(/\/.*$/, "");
  const fait = contactes[l.id];
  return `
    <div class="offre atelier ${fait ? "contacte" : ""}">
      <div class="haut"><div class="titre">${esc(l.nom)}</div>
        <div class="tags">${l.chaine ? '<span class="contrat">Chaîne</span>' : ""}<span class="contrat">${esc(l.type)}</span></div></div>
      <div class="ent">${esc(l.ville)} · ${l.km} km</div>
      <div class="bas" style="margin-top:6px">${l.salaries ? esc(l.salaries) : "Nombre de salariés non connu"}</div>
      ${l.site || l.tel || l.mail ? `<div class="liens">
        ${l.site ? `<a href="${esc(l.site)}" target="_blank" rel="noopener">${esc(site)} ↗</a>` : ""}
        ${l.tel ? `<a href="tel:${esc(l.tel.replace(/[^+\d]/g, ""))}">${esc(l.tel)}</a>` : ""}
        ${l.mail ? `<a href="mailto:${esc(l.mail)}">${esc(l.mail)}</a>` : ""}</div>`
        : '<div class="inconnu">Ni site, ni téléphone, ni e-mail connus</div>'}
      <button class="contact ${fait ? "fait" : ""}" data-contact="${esc(l.id)}">
        ${fait ? `✓ Contacté le ${dateFr(fait)}` : "Marquer comme contacté"}</button>
    </div>`;
}

function filtrerAteliers() {
  const q = recherche.toLowerCase();
  return annuaire.liste.filter(l => filtresA[l.type] && (filtresA["Chaînes"] || !l.chaine)
    && (!filtresA["Avec salariés"] || salarie(l)) && (!filtresA["À contacter"] || !contactes[l.id])
    && (!q || `${l.nom} ${l.ville}`.toLowerCase().includes(q)));
}

function afficher() {
  const chips = document.getElementById("chips"), liste = document.getElementById("liste");
  const surCarte = !document.body.classList.contains("liste") && innerWidth < 900;
  document.querySelectorAll(".onglets button").forEach(b => b.setAttribute("aria-selected", b.dataset.vue === (surCarte ? "carte" : mode)));

  // --- ateliers sur la carte (petits points) ---
  const ateliers = filtrerAteliers();
  calqueAteliers.clearLayers();
  ateliers.forEach(l => L.circleMarker(l.coords, {
      radius: l.id === ficheId ? 8 : 4.5, weight: l.id === ficheId ? 3 : 1.5, color: encre,
      fillColor: contactes[l.id] ? "#9b9b9b" : l.type === "Atelier" ? encre : papier,
      fillOpacity: 1, opacity: contactes[l.id] ? .4 : .85 })
    .on("click", e => { L.DomEvent.stopPropagation(e); ficheId = l.id; afficher(); })
    .addTo(calqueAteliers));
  const lieu = annuaire.liste.find(l => l.id === ficheId);
  const fiche = document.getElementById("fiche");
  fiche.hidden = !lieu || document.body.classList.contains("liste") && innerWidth < 900;
  fiche.innerHTML = lieu ? ficheAtelier(lieu) + '<button class="fermer" aria-label="Fermer">✕</button>' : "";

  // --- offres sur la carte (ronds numérotés par ville) ---
  const offres = data.offres.filter(o => actifs.has(groupe(o.contrat)));
  calque.clearLayers();
  const parVille = {};
  offres.filter(o => o.coords).forEach(o => (parVille[o.ville] ??= []).push(o));
  for (const [ville, os] of Object.entries(parVille)) {
    const m = L.marker(os[0].coords, { icon: L.divIcon({ className: "", iconSize: null,
        html: `<div class="pin ${ville === villeChoisie ? "actif" : ""}" data-ville="${esc(ville)}">${os.length}</div>` }) })
      .bindTooltip(`${esc(ville)} · ${pluriel(os.length, "offre")}`, { direction: "top", offset: [0, -12] })
      .on("click", () => { vue("offres"); villeChoisie = ville; afficher(); })
      .addTo(calque);
    m.vraie = L.latLng(os[0].coords);
  }
  ecarter();

  if (mode === "ateliers") {
    document.getElementById("sous").textContent = `Annuaire · ${annuaire.liste.length} lieux · mis à jour ${ilYa(annuaire.maj)}`;
    const nb = { Atelier: l => l.type === "Atelier", Bijouterie: l => l.type === "Bijouterie", "Chaînes": l => l.chaine,
                 "Avec salariés": salarie, "À contacter": l => !contactes[l.id] };
    chips.innerHTML = Object.keys(filtresA).map(f => `<button class="chip" aria-pressed="${filtresA[f]}" data-a="${f}">${f}` +
      `<span>${annuaire.liste.filter(nb[f]).length}</span></button>`).join("");
    const faits = annuaire.liste.filter(l => contactes[l.id]).length;
    document.getElementById("enteteListe").innerHTML =
      `<input class="recherche" id="recherche" type="search" placeholder="Rechercher un nom ou une ville" value="${esc(recherche)}">` +
      `${pluriel(ateliers.length, "lieu").replace("lieus", "lieux")}${faits ? ` · ${faits} contacté${faits > 1 ? "s" : ""}` : ""}`;
    liste.innerHTML = ateliers.length ? ateliers.map(ficheAtelier).join("")
      : `<div class="vide"><b>Aucun lieu avec ces filtres</b><p>Essaie d'en désactiver un.</p></div>`;
    return;
  }

  document.getElementById("sous").textContent = `Armentières 30 km · vérifié ${ilYa(data.maj)}`;
  chips.innerHTML = (villeChoisie ? `<button class="chip ville" data-ville-off>${esc(villeChoisie)} ✕</button>` : "") +
    CONTRATS.map(c => `<button class="chip" aria-pressed="${actifs.has(c)}" data-c="${c}">${c}` +
      `<span>${data.offres.filter(o => groupe(o.contrat) === c).length}</span></button>`).join("");
  const choix = villeChoisie ? offres.filter(o => o.ville === villeChoisie) : offres;
  const nouvelles = choix.filter(estNouvelle).length;
  document.getElementById("enteteListe").textContent = choix.length
    ? pluriel(choix.length, "offre") + (nouvelles ? ` · ${pluriel(nouvelles, "nouvelle")}` : "") : "";
  liste.innerHTML = choix.length ? choix.map(o => `
    <a class="offre" href="${esc(o.url)}" target="_blank" rel="noopener" data-ville="${esc(o.ville)}">
      <div class="haut"><div class="titre">${esc(o.titre)}</div><span class="contrat">${esc(o.contrat)}</span></div>
      <div class="ent">${esc(o.entreprise)}</div>
      ${o.description ? `<div class="desc">${esc(o.description)}</div>` : ""}
      <div class="bas">
        ${estNouvelle(o) ? '<span class="nouveau">Nouveau</span><span class="sep"></span>' : ""}
        <span>${esc(o.ville)}</span><span class="sep"></span><span>${esc(o.source)}</span>
        ${o.date ? `<span class="sep"></span><span>${esc(o.date)}</span>` : ""}
      </div>
    </a>`).join("")
    : `<div class="vide">
         <div class="rond"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l7 7-7 11-7-11z"/></svg></div>
         <b>${data.offres.length ? "Aucune offre avec ces filtres" : "Aucune offre pour le moment"}</b>
         <p>${data.offres.length ? "Essaie d'activer d'autres types de contrat."
           : "La liste se met à jour toute seule plusieurs fois par jour. En attendant, regarde l'onglet Ateliers pour les candidatures spontanées."}</p>
       </div>`;
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  if ("villeOff" in b.dataset) villeChoisie = null;
  else if (b.dataset.a) filtresA[b.dataset.a] = !filtresA[b.dataset.a];
  else actifs.has(b.dataset.c) ? actifs.delete(b.dataset.c) : actifs.add(b.dataset.c);
  afficher();
});
// bouton « contacté » : dans la liste comme dans la bulle de la carte
document.addEventListener("click", e => {
  const b = e.target.closest("[data-contact]");
  if (!b) return;
  basculerContact(b.dataset.contact);
});
document.getElementById("fiche").addEventListener("click", e => { if (e.target.closest(".fermer")) { ficheId = null; afficher(); } });
carte.on("click", () => { if (ficheId) { ficheId = null; afficher(); } });
document.getElementById("enteteListe").addEventListener("input", e => {
  recherche = e.target.value;
  afficher();
  const champ = document.getElementById("recherche");
  champ.focus(); champ.setSelectionRange(recherche.length, recherche.length);
});
// survol d'une offre (ordinateur) : le rond de sa ville grossit
document.getElementById("liste").addEventListener("mouseover", e => {
  const v = e.target.closest(".offre")?.dataset.ville;
  document.querySelectorAll(".pin").forEach(p => p.classList.toggle("actif", p.dataset.ville === v || p.dataset.ville === villeChoisie));
});
document.querySelector(".onglets").addEventListener("click", e => { const b = e.target.closest("button"); if (b) vue(b.dataset.vue); });
addEventListener("resize", () => { cadrer(); afficher(); });
vue(innerWidth >= 900 ? "offres" : "carte");
</script>
</body>
</html>
